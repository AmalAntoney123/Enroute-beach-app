{% extends "base.html" %}

{% block content %}
<div class="admin-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if active_tab == 'panel' }}" href="{{ url_for('admin.panel') }}">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if active_tab == 'users' }}" href="{{ url_for('admin.manage_users') }}">
                    <i class="fas fa-users me-2"></i>User Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if active_tab == 'alerts' }}" href="{{ url_for('admin.manage_alerts') }}">
                    <i class="fas fa-bell me-2"></i>Alerts
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if active_tab == 'beaches' }}" href="{{ url_for('admin.manage_beaches') }}">
                    <i class="fas fa-umbrella-beach me-2"></i>Beaches
                </a>
            </li>
        </ul>
    </div>

    <!-- Main content -->
    <div class="main-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>

<style>
.admin-container {
    display: flex;
    min-height: calc(100vh - 116px); /* Viewport height minus header and footer */
    margin-top: 56px; /* Header height */
}

.sidebar {
    width: 250px;
    background-color: #f8f9fa;
    border-right: 1px solid rgba(0,0,0,.1);
    padding: 1rem 0;
    flex-shrink: 0;
}

.main-content {
    flex-grow: 1;
    padding: 1.5rem;
    overflow-y: auto;
}

.sidebar .nav-link {
    color: #333;
    padding: 0.8rem 1rem;
    font-weight: 500;
    display: flex;
    align-items: center;
}

.sidebar .nav-link:hover {
    color: #2470dc;
    background-color: rgba(36, 112, 220, 0.05);
}

.sidebar .nav-link.active {
    color: #2470dc;
    background-color: rgba(36, 112, 220, 0.1);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .admin-container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(0,0,0,.1);
    }

    .main-content {
        width: 100%;
    }
}
</style>
{% endblock %}
